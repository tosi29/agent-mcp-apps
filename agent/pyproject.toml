[project]
name = "exploration-agent"
version = "0.1.0"
description = "Local structured-data exploration PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ag-ui-protocol==1.0.0",
  "ag-ui-strands==1.0.2",
  "aws-opentelemetry-distro==0.22.0",
  "boto3==1.43.123",
  "botocore==1.43.123",
  "fastapi==0.162.0",
  "httpx2==2.16.0",
  "mcp==2.3.0",
  "strands-agents[openai]==1.63.0",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[project.scripts]
explore = "exploration_agent.entrypoints.cli:main"
explore-server = "exploration_agent.entrypoints.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
