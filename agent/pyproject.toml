[project]
name = "exploration-agent"
version = "0.1.0"
description = "Local structured-data exploration PoC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "duckdb==2.0.0",
  "strands-agents[openai]==1.63.0",
]

[dependency-groups]
dev = ["httpx2==2.16.0", "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[project.scripts]
explore = "exploration_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
