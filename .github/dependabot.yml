version: 2

# npm・uv・GitHub Actionsのバージョン更新を1つのPRにまとめる。
# Actionsの更新では、同じPRで .github/workflows/actions.lock も更新される。
# セキュリティ更新は、このグループとは別にPRが作られる場合がある。
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"

updates:
  - package-ecosystem: "npm"
    directory: "/app"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "uv"
    directory: "/agent"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "uv"
    directory: "/mcp"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "npm"
    directory: "/mcp/ui"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
