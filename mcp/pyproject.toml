[project]
name = "exploration-mcp"
version = "0.1.0"
description = "Local and AgentCore MCP tools for the data explorer"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb==2.0.0", "mcp==2.3.0", "starlette==1.10.0", "uvicorn==0.54.0"]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[project.scripts]
explore-mcp = "exploration_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/exploration_mcp/ui/dashboard.html" = "exploration_mcp/ui/dashboard.html"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
